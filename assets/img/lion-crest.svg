<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="醒狮头徽">
  <defs>
    <radialGradient id="rim" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#E8B21C"/>
      <stop offset="62%" stop-color="#D09219"/>
      <stop offset="100%" stop-color="#A96B0F"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D93A20"/>
      <stop offset="100%" stop-color="#8E1610"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0C2"/>
      <stop offset="100%" stop-color="#F2C64A"/>
    </linearGradient>
    <circle id="sc" cx="100" cy="45" r="13.5"/>
  </defs>

  <!-- 外圈 -->
  <circle cx="100" cy="100" r="99" fill="#8E1610"/>
  <circle cx="100" cy="100" r="95" fill="url(#rim)"/>
  <circle cx="100" cy="100" r="86" fill="url(#disc)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#7A100A" stroke-width="1.5"/>

  <!-- 鬃毛（一圈小圆） -->
  <g fill="#E8B21C">
    <use href="#sc" transform="rotate(0 100 100)"/>
    <use href="#sc" transform="rotate(25.7 100 100)"/>
    <use href="#sc" transform="rotate(51.4 100 100)"/>
    <use href="#sc" transform="rotate(77.1 100 100)"/>
    <use href="#sc" transform="rotate(102.9 100 100)"/>
    <use href="#sc" transform="rotate(128.6 100 100)"/>
    <use href="#sc" transform="rotate(154.3 100 100)"/>
    <use href="#sc" transform="rotate(180 100 100)"/>
    <use href="#sc" transform="rotate(205.7 100 100)"/>
    <use href="#sc" transform="rotate(231.4 100 100)"/>
    <use href="#sc" transform="rotate(257.1 100 100)"/>
    <use href="#sc" transform="rotate(282.9 100 100)"/>
    <use href="#sc" transform="rotate(308.6 100 100)"/>
    <use href="#sc" transform="rotate(334.3 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="62" fill="#C6281C"/>

  <!-- 耳朵 -->
  <ellipse cx="56" cy="74" rx="15" ry="11" fill="#E8B21C" transform="rotate(-24 56 74)"/>
  <ellipse cx="144" cy="74" rx="15" ry="11" fill="#E8B21C" transform="rotate(24 144 74)"/>
  <ellipse cx="56" cy="74" rx="8" ry="5.5" fill="#8E1610" transform="rotate(-24 56 74)"/>
  <ellipse cx="144" cy="74" rx="8" ry="5.5" fill="#8E1610" transform="rotate(24 144 74)"/>

  <!-- 独角 -->
  <path d="M100 30c6 0 11 5 11 11 0 4-2 7-5 9-3-6-8-10-14-11 1-5 4-9 8-9z" fill="#E8B21C"/>
  <path d="M100 30c-6 0-11 5-11 11 0 4 2 7 5 9 3-6 8-10 14-11-1-5-4-9-8-9z" fill="#F5C518"/>

  <!-- 脸 -->
  <ellipse cx="100" cy="106" rx="48" ry="43" fill="url(#face)"/>
  <ellipse cx="100" cy="106" rx="48" ry="43" fill="none" stroke="#B47814" stroke-width="1.6"/>

  <!-- 额镜 -->
  <circle cx="100" cy="79" r="10" fill="#C6281C"/>
  <circle cx="100" cy="79" r="4.4" fill="#F5C518"/>

  <!-- 眉毛卷云 -->
  <path d="M64 92c0-9 7-16 16-16 5 0 9 2 12 5" fill="none" stroke="#C6281C" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M136 92c0-9-7-16-16-16-5 0-9 2-12 5" fill="none" stroke="#C6281C" stroke-width="4.2" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <ellipse cx="76" cy="105" rx="15" ry="12" fill="#FFFDF4"/>
  <ellipse cx="124" cy="105" rx="15" ry="12" fill="#FFFDF4"/>
  <circle cx="78" cy="105" r="7" fill="#33210F"/>
  <circle cx="122" cy="105" r="7" fill="#33210F"/>
  <circle cx="80.4" cy="102.4" r="2.4" fill="#FFFFFF"/>
  <circle cx="124.4" cy="102.4" r="2.4" fill="#FFFFFF"/>

  <!-- 鼻 -->
  <path d="M100 116c6 0 10 4 10 8s-4 7-10 7-10-3-10-7 4-8 10-8z" fill="#B3271E"/>

  <!-- 嘴与牙 -->
  <path d="M74 134c6 8 15 12 26 12s20-4 26-12c-7 4-16 6-26 6s-19-2-26-6z" fill="#8E1610"/>
  <rect x="88" y="132" width="5.6" height="7" rx="1.6" fill="#FFFDF4"/>
  <rect x="106.4" y="132" width="5.6" height="7" rx="1.6" fill="#FFFDF4"/>
  <path d="M94 145c0-3 2.7-5 6-5s6 2 6 5v2c0 3-2.7 5-6 5s-6-2-6-5z" fill="#D93A20"/>

  <!-- 腮边卷须 -->
  <path d="M50 118c-6 3-8 11-4 16 3 4 9 4 12 0" fill="none" stroke="#E8B21C" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M150 118c6 3 8 11 4 16-3 4-9 4-12 0" fill="none" stroke="#E8B21C" stroke-width="3.4" stroke-linecap="round"/>

  <!-- 外圈铆钉 -->
  <g fill="#7A100A">
    <circle cx="100" cy="7" r="2.6"/><circle cx="100" cy="193" r="2.6"/>
    <circle cx="7" cy="100" r="2.6"/><circle cx="193" cy="100" r="2.6"/>
    <circle cx="34.2" cy="34.2" r="2.6"/><circle cx="165.8" cy="34.2" r="2.6"/>
    <circle cx="34.2" cy="165.8" r="2.6"/><circle cx="165.8" cy="165.8" r="2.6"/>
  </g>
</svg>
